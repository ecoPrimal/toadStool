[package]
name = "toadstool-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Configuration management for ToadStool - Zero hardcoding hierarchical configuration system"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# File system and path handling (native only — no filesystem on WASM)
etcetera = { workspace = true, optional = true }

# Internal dependencies
toadstool-common = { path = "../common", default-features = false }

# Note: mDNS discovery available via toadstool crate (when needed for tests)
# Production code uses cache-based discovery; full mDNS via toadstool::discovery

[dev-dependencies]
serde_yaml_ng = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
approx = "0.5"
# num_cpus removed: use std::thread::available_parallelism() instead (pure Rust, no FFI)

[features]
default = ["runtime"]
runtime = ["dep:tokio", "dep:etcetera", "toadstool-common/runtime"]

[lints]
workspace = true

