[package]
name = "toadstool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool Universal Compute Platform - Core library for universal execution"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core dependencies — default-features disabled; runtime feature re-enables them
toadstool-common = { path = "../common", default-features = false }
toadstool-config = { path = "../config", default-features = false }
toadstool-core = { path = "../../toadstool-core", default-features = false }

# Async runtime — optional behind `runtime` feature for WASM compatibility
tokio = { workspace = true, optional = true }
futures = { workspace = true }

# Serialization (rc for Arc<str> zero-copy in storage types)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bytes = { workspace = true }

# Unique identifiers — v4 (random generation) gated behind runtime for WASM compat
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

# Error handling
thiserror = { workspace = true }

# Property-test strategies (`proptest_strategies` module) — optional for downstream crates
proptest = { workspace = true, optional = true }

# System monitoring — Pure Rust via /proc (replaces sysinfo)
toadstool-sysmon = { workspace = true, optional = true }

# Encoding
base64 = { workspace = true }

mdns-sd = { workspace = true, optional = true }

# The demo initialises tracing-subscriber, which is optional and behind
# `logging`. Declaring that here lets `cargo test --workspace` skip the
# example instead of failing to build it.
[[example]]
name = "universal_demo"
required-features = ["logging"]

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toadstool-testing = { path = "../../testing" }
proptest = { workspace = true }

[features]
# S206: test-mocks removed from default — production builds no longer compile mock backends.
# Run `cargo test --features test-mocks` for InMemory/mock test targets.
default = ["runtime", "mdns"]
# Tokio async runtime + I/O modules. Disable for WASM-only types/traits builds.
runtime = ["dep:tokio", "dep:toadstool-sysmon", "toadstool-common/runtime", "toadstool-common/mdns", "toadstool-common/btsp", "toadstool-config/runtime", "toadstool-core/runtime", "uuid/v4"]
# In-memory auth mock (`InMemoryAuthBackend`); for tests and explicit `--features test-mocks`
test-mocks = []
# Gates Unix JSON-RPC IPC paths in ecosystem modules (no HTTP client)
networking = []
# mDNS bootstrap discovery (songBird's domain -- use for cold-start only)
mdns = ["dep:mdns-sd"]
# Proptest generators for workload/resource types (`crate::proptest_strategies`).
proptest-strategies = ["dep:proptest"]
# Vestigial hardening modules (async_ops, caching, circuit_breaker, intrusion); zero production callers
hardening = ["runtime"]
# tracing-subscriber fmt/env-filter init (`init()`); omit for lightweight WASM/types-only builds
logging = ["dep:tracing-subscriber"]

[[test]]
name = "biomeos_auth_coverage_tests"
path = "tests/test_mocks/biomeos_auth_coverage_tests.rs"
required-features = ["test-mocks"]

[[test]]
name = "biomeos_backend_comprehensive_tests"
path = "tests/test_mocks/biomeos_backend_comprehensive_tests.rs"
required-features = ["test-mocks"]

[[test]]
name = "biomeos_auth_tests"
path = "tests/test_mocks/biomeos_auth_tests.rs"
required-features = ["test-mocks"]

[lints]
workspace = true

