[package]
name = "toadstool-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Common utilities and types for ToadStool"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core dependencies (always available — types, traits, error handling)
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
humantime-serde = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
semver = { version = "1.0.27", features = ["serde"] }

# Runtime dependencies (async networking, IPC — requires OS sockets/threads)
tokio = { workspace = true, optional = true }

# mDNS bootstrap discovery (Songbird's domain; cold-start only)
mdns-sd = { workspace = true, optional = true }

# BTSP handshake (pure Rust crypto per BTSP_PROTOCOL_STANDARD.md)
x25519-dalek = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
tokio = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }
toadstool = { path = "../toadstool", features = ["proptest-strategies"] }

[features]
default = ["runtime", "mdns", "btsp"]
# Async runtime (tokio) — requires OS-level sockets/threads. Enables async discovery, IPC, UUID generation.
runtime = ["dep:tokio", "uuid/v4"]
# mDNS bootstrap discovery (Songbird's domain; use for cold-start only)
mdns = ["runtime", "dep:mdns-sd"]
# BTSP handshake for production socket authentication
btsp = ["runtime", "dep:x25519-dalek", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:chacha20poly1305", "dep:rand"]

[lints]
workspace = true

