[package]
name = "toadstool-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true  
homepage.workspace = true
documentation.workspace = true
description = "Testing utilities, mocks, and infrastructure for ToadStool"
keywords = ["testing", "mocks", "utilities", "toadstool"]
categories = ["development-tools::testing"]
readme = "README.md"

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core ToadStool dependencies
toadstool = { path = "../core/toadstool", features = ["test-mocks"] }
toadstool-common = { path = "../core/common" }
hw-learn = { path = "../core/hw-learn" }

# Testing framework
tokio = { workspace = true }
tokio-test = { workspace = true }

# Mocking and testing utilities
mockall = "0.12"
proptest = { workspace = true }
# S206: wiremock removed — integration-tests feature was never used in source.

# Async testing
futures = { workspace = true }

# Serialization for test data
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Time and UUID for test data
uuid = { workspace = true }

# Temporary directories and files for testing
tempfile = { workspace = true }
# tempdir removed: deprecated crate, tests already use tempfile

# HTTP client for integration tests
# PURE RUST: reqwest removed even from testing (use unix sockets in tests too!)
# reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# Logging for tests
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Random data generation
rand = { workspace = true }
fake = { version = "2.0", features = ["derive", "uuid"] }


# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon

[dev-dependencies]
criterion = { workspace = true }
temp-env = { workspace = true }

[features]
default = []
slow-tests = []
# S206: integration-tests (unused wiremock gate) and benchmarks (empty) removed — no source references.

[lints]
workspace = true
