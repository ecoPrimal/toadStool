[package]
name = "toadstool-integration-protocols"
version.workspace = true
edition.workspace = true
description = "ToadStool communication protocols and service discovery"
license.workspace = true
repository.workspace = true
keywords = ["protocols", "integration", "primal", "rpc"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["runtime"]
# Tokio async runtime, transport, and client modules. Disable for WASM-only types builds.
runtime = [
    "dep:tokio",
    "dep:toadstool",
    "dep:bytes",
    "toadstool/runtime",
    "toadstool-common/runtime",
    "toadstool-config/runtime",
    "uuid/v4",
    "tarpc-transport",
]
tarpc-transport = ["dep:tarpc", "dep:bytes"]
# Implemented but unwired — MessagePack transport. JSON-RPC over Unix sockets is the live path.
binary-transport = ["tarpc-transport", "dep:tokio-serde", "dep:tokio-util", "dep:futures"]
# Vestigial protocol client (~2.5k LOC); biomeOS owns capability routing
legacy-protocol-client = ["runtime"]
# Vestigial security client (~2k LOC); production uses distributed/crypto_integration
legacy-security-client = ["runtime"]

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core ToadStool types
toadstool = { path = "../../core/toadstool", default-features = false, optional = true }
toadstool-common = { path = "../../core/common", default-features = false }
toadstool-config = { path = "../../core/config", default-features = false }

# RPC frameworks
tarpc = { workspace = true, optional = true }

# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Binary framing (optional; `binary-transport` feature)
futures = { workspace = true, optional = true }
tokio-serde = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

# Serialization (rc for Arc<str> zero-copy serialization)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bytes = { workspace = true, optional = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID support
uuid = { workspace = true }

[[test]]
name = "protocol_client_tests"
required-features = ["legacy-protocol-client"]

[[test]]
name = "transport_expansion_tests"
required-features = ["legacy-protocol-client"]

[[test]]
name = "transport_tests"
required-features = ["legacy-protocol-client"]

[[test]]
name = "transport_coverage_tests"
required-features = ["legacy-protocol-client"]

[[test]]
name = "beardog_integration_tests"
required-features = ["legacy-security-client"]

[[test]]
name = "protocol_async_integration_tests"
required-features = ["legacy-security-client"]

[[test]]
name = "beardog_integration_coverage_tests"
required-features = ["legacy-security-client"]

[[test]]
name = "beardog_types_comprehensive_tests"
required-features = ["legacy-security-client"]

[[test]]
name = "security_client_coverage_tests"
required-features = ["legacy-security-client"]

[[test]]
name = "protocol_types_comprehensive_tests"
required-features = ["legacy-security-client"]

[dev-dependencies]
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[lints]
workspace = true
