[package]
name = "toadstool-integration-primals"
version.workspace = true
edition.workspace = true
description = "Primal integration framework for biomeOS orchestration"
authors = ["ToadStool Team <team@toadstool.io>"]
license.workspace = true
repository.workspace = true
homepage = "https://toadstool.io"
keywords = ["biomeOS", "primals", "orchestration", "integration"]
categories = ["science", "network-programming"]

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

# HTTP client for service communication

# Workspace dependencies
toadstool-core = { path = "../../toadstool-core", default-features = false }
toadstool-config = { path = "../../core/config", default-features = false }
toadstool = { path = "../../core/toadstool", default-features = false }
toadstool-common = { path = "../../core/common", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
tokio-test = { workspace = true }
mockall = "0.12"
proptest = { workspace = true }

[features]
default = ["runtime"]
runtime = ["toadstool/runtime", "toadstool-common/runtime", "toadstool-config/runtime"]

[lints]
workspace = true
