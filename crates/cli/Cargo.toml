[package]
name = "toadstool-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "ToadStool CLI - Universal Compute Command Center for Sovereign Science"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "toadstool"
path = "src/main.rs"
doc = false  # Avoid doc collision with toadstool lib (target/doc/toadstool/index.html)

# UNIBIN EVOLUTION (Jan 27, 2026):
# Removed legacy binary aliases (toadstool-cli, toadstool-server).
# These violated the UniBin standard (wateringHole/UNIBIN_ARCHITECTURE_STANDARD.md).
#
# MIGRATION PATH:
# - Old: toadstool-server
# - New: toadstool daemon
#
# The main.rs still detects legacy names (for symlinks) but we no longer
# build multiple binaries. Users should migrate to the canonical UniBin interface.
#
# See: wateringHole/UNIBIN_ARCHITECTURE_STANDARD.md for details.

[dependencies]
# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Core ToadStool crates
toadstool = { path = "../core/toadstool" }
toadstool-common = { path = "../core/common" }
toadstool-core = { path = "../toadstool-core" }
toadstool-ember = { path = "../core/ember" }
toadstool-glowplug = { path = "../core/glowplug" }
toadstool-config = { path = "../core/config" }
toadstool-distributed = { path = "../distributed" }
toadstool-server = { path = "../server" }  # UniBin Phase 2: Server library integration (library compiles!)
# Intelligent auto-configuration library (hardware detection, ecosystem discovery, NL config).
# CLI `zero_config/` is the deployment orchestration layer; this crate is the backend.
toadstool-auto-config = { path = "../auto_config", optional = true }
# Runtime engines
toadstool-runtime-container = { path = "../runtime/container", features = ["docker"] }
toadstool-runtime-native = { path = "../runtime/native" }
# EVOLVED: toadstool-runtime-python removed — pyo3 FFI violates ecoBin v3.0
toadstool-runtime-wasm = { path = "../runtime/wasm", optional = true }  # Optional: pure Rust (wasmi)
wasmi = { workspace = true, optional = true }  # For WASM execution when wasm feature enabled
toadstool-runtime-gpu = { path = "../runtime/gpu", optional = true }

# CLI framework
clap = { workspace = true, features = ["color", "suggestions"] }

# Async runtime (signal: daemon SIGTERM/SIGINT)
tokio = { workspace = true, features = ["signal"] }
futures = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization (rc for Arc<str> zero-copy in metadata)
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }

# UUID generation
uuid = { workspace = true, features = ["v4"] }

# File system operations (Pure Rust!)
etcetera = { workspace = true }

# Networking
# PURE RUST: reqwest removed - unix sockets only! ✅
# mdns = "3.0"  # Note: mDNS discovery available via toadstool-config crate

# System monitoring — Pure Rust via /proc (replaces sysinfo, zero C)
toadstool-sysmon = { workspace = true }

# Neuromorphic hardware — excluded from default workspace (requires rustChip/akida-chip on biomeGate)
# akida-driver = { path = "../neuromorphic/akida-driver", optional = true }

# Terminal UI and formatting
colored = "2.0"
# atty removed (Feb 14, 2026): use std::io::IsTerminal (Rust 1.70+)

# Process management
# which removed: CLI uses Command::new("which"), not the crate

# Encoding / integrity
base64 = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }

# barracuda removed S94b: nautilus methods are now proxied to barraCuda via
# capability-based IPC (JSON-RPC over Unix socket). Zero library coupling.


# HTTP client
url = { workspace = true }

# EVOLVED: axum/tower/tower-http removed — daemon uses pure_jsonrpc over Unix sockets.
# HTTP is songBird's domain per PRIMAL_RESPONSIBILITY_MATRIX.

[dev-dependencies]
anyhow = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2.0"
predicates = "3.0"
# `process` is needed only by the e2e tests spawning the built binary; keeping
# it out of the runtime dependency avoids pulling it into the shipped CLI.
tokio = { workspace = true, features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
toadstool-cylinder = { path = "../core/cylinder" }
nvpmu = { path = "../core/nvpmu" }
toadstool-display = { path = "../runtime/display", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
toadstool-hw-safe = { path = "../core/hw-safe" }

[features]
default = ["full"]
slow-tests = []
full = ["daemon", "wasm", "nautilus", "zero-config"]
# Intelligent auto-config backend for `zero_config/` deployment flow
zero-config = ["dep:toadstool-auto-config"]
# Workload sandboxing (seccomp, capabilities) — passes through to server
sandbox = ["toadstool-server/sandbox"]
# BTSP on daemon JSON-RPC (FAMILY_ID production mode); passes through to toadstool-common
btsp = ["toadstool-common/btsp"]
daemon = ["btsp"]
wasm = ["dep:toadstool-runtime-wasm", "dep:wasmi"]  # Optional: WASM runtime

# GPU FEATURES: Sovereign + Pragmatic
gpu = ["toadstool-runtime-gpu"]  # WebGPU by default (pure Rust, universal)
gpu-ai = ["gpu", "toadstool-runtime-gpu/ai-ml"]  # WebGPU + AI/ML extensions
gpu-full = ["gpu", "toadstool-runtime-gpu/all-backends"]  # Maximum compatibility

# NPU support — requires akida-driver last-mile wiring (AkidaNpuDispatch adapter). Not yet functional.
# Full: npu = ["dep:akida-driver"]  — blocked on C5 (rustChip → Forgejo)
npu = []

# Display / hardware transport (petalTongue domain — DRM, V4L2, serial)
display = ["dep:toadstool-display"]

# Nautilus: proxied to barraCuda via capability-based IPC (zero library dep)
nautilus = []

# Workload migration CLI and orchestration stubs (platform capabilities not yet wired)
migration-preview = []

# Vestigial monitoring stack (collectors, metrics store, alerting, dashboards) — no CLI wiring yet
cli-monitoring = []

[lints]
workspace = true

