[package]
name = "toadstool-auto-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Zero-touch auto-configuration system for ToadStool Universal Compute Platform"
readme = "README.md"
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Core ToadStool dependencies (toadstool optional — lib uses common/config only)
toadstool = { path = "../core/toadstool", default-features = false, optional = true }
toadstool-common = { path = "../core/common", default-features = false }
toadstool-config = { path = "../core/config", default-features = false }

# Async runtime (optional — gated behind `runtime` for WASM compat)
tokio = { workspace = true, optional = true }

# Canonical ecosystem types (cellMembrane)
cellmembrane-types.workspace = true

# Workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
thiserror = { workspace = true }
# PURE RUST: reqwest removed - unix sockets only! ✅
url = { workspace = true, optional = true }

# EVOLVED: sysinfo removed (Mar 9, 2026) — replaced by toadstool-sysmon (pure Rust /proc)
# EVOLVED: nix dependency removed (Feb 14, 2026) - unused, prefer rustix

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }

[features]
default = ["runtime"]
runtime = [
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:toadstool",
    "toadstool/runtime",
    "toadstool-common/runtime",
    "toadstool-config/runtime",
    "uuid/v4",
]
test-mocks = []  # Enable mock implementations for testing
slow-tests = []  # Enable slow integration tests (hardware detection, NL processing)
# TCP port scanner for RFC1918 ecosystem service discovery (songBird domain)
network-scan = ["runtime"]

[lints]
workspace = true
