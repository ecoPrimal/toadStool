[package]
name = "toadstool-core"
version.workspace = true
edition.workspace = true
authors = ["ToadStool Contributors"]
description = "Core hardware infrastructure layer for ToadStool compute primals"
license.workspace = true
repository.workspace = true
keywords = ["hardware", "infrastructure", "compute", "npu"]
categories = ["hardware-support", "development-tools"]

[dependencies]
cellmembrane-types.workspace = true
toadstool-common = { path = "../core/common", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
zeroize = { workspace = true }
humantime-serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
runtime = ["uuid/v4"]

[lints]
workspace = true

